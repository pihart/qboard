name: Request Pages preview

on:
  push:
    branches-ignore:
      - gh-pages

permissions:
  contents: read

jobs:
  request-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages refresh
        env:
          CONTROLLER_TOKEN: ${{ secrets.QBOARD_PAGES_CONTROLLER_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $CONTROLLER_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/pihart/qboard-pages-controller/actions/workflows/deploy.yml/dispatches \
            --data '{"ref":"main"}'
